[workspace]
resolver = "2"
exclude = [
    "examples/websocket_chat",
    "examples/rest_api",
    "examples/sse_demo",
    "examples/tls_rustls",
    "examples/tls_hot_reload",
    "examples/native_tls",
    "examples/h2c",
    "examples/static_files",
    "examples/embedded_static",
    "examples/debug_handler",
    "examples/route_macro",
    "examples/handler_macro",
    "examples/test_client",
    "examples/config_app",
    "examples/graceful_shutdown",
    "examples/metrics",
    "examples/opentelemetry",
    "examples/health_checks",
    "examples/request_validation",
    "examples/structured_logging",
    "examples/performance_tuning",
    "examples/benchmarks",
]
members = [
    "arvik",
    "arvik-core",
    "arvik-router",
    "arvik-hyper",
    "arvik-extract",
    "arvik-middleware",
    "arvik-ws",
    "arvik-sse",
    "arvik-static",
    "arvik-tls",
    "arvik-macros",
    "arvik-test",
    "arvik-config",
    "arvik-observe",
]

[workspace.package]
version = "0.9.5"
edition = "2024"
license = "MIT OR Apache-2.0"
readme       = "README.md"
repository = "https://github.com/AarambhDevHub/arvik"
authors = ["Aarambh Dev Hub"]
rust-version = "1.85"
description = "Fast, Typed, and Fearless Web Framework for Rust"

[workspace.dependencies]
# Async runtime
tokio          = { version = "1", features = ["full"] }
tokio-stream   = "0.1"

# HTTP
hyper          = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util     = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http           = "1"
http-body      = "1"
http-body-util = "0.1"

# Tower
tower          = { version = "0.5", features = ["full"] }
tower-http     = { version = "0.6", features = ["full"] }
tower-layer    = "0.3"
tower-service  = "0.3"

# Bytes
bytes          = "1"

# Serde
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
serde_urlencoded = "0.7"
toml           = "0.8"

# WebSocket
tokio-tungstenite = "0.24"

# TLS
rustls         = "0.23"
tokio-rustls   = "0.26"
rustls-pemfile = "2"
rcgen          = "0.14"
notify         = "8"
x509-parser    = "0.18"
native-tls     = { version = "0.2", features = ["alpn", "alpn-accept"] }
tokio-native-tls = "0.3"

# Multipart
multer         = "3"

# Compression
async-compression = { version = "0.4", features = ["gzip", "brotli", "zstd", "deflate", "tokio"] }

# Routing
matchit        = "0.8"

# Utilities
pin-project-lite = "0.2"
futures-util   = "0.3"
ahash          = "0.8"
smallvec       = { version = "1", features = ["union"] }
parking_lot    = "0.12"
thiserror      = "2"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus     = "0.13"
opentelemetry  = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "grpc-tonic", "http-proto", "reqwest-client"] }
opentelemetry-stdout = { version = "0.32", features = ["trace"] }
tracing-opentelemetry = "0.33"
validator      = { version = "0.20", features = ["derive"] }
uuid           = { version = "1", features = ["v4"] }
mime           = "0.3"
mime_guess     = "2"
percent-encoding = "2"
httpdate       = "1"
itoa           = "1"
headers        = "0.4"
rust-embed     = "8"
once_cell      = "1"
socket2        = { version = "0.6", features = ["all"] }
tokio-metrics  = "0.4"

# Proc macro (arvik-macros only)
syn            = { version = "2", features = ["full"] }
quote          = "1"
proc-macro2    = "1"
proc-macro-crate = "3"
trybuild       = "1"

# Cookies (0.3.3)
cookie = { version = "0.18", features = ["percent-encode", "signed", "private"] }

# tokio-util needed for io bridges (ReaderStream, StreamReader)
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"

# base64 for Basic auth encoding/decoding
base64 = "0.22"

sha1 = "0.10"

# Internal crates
arvik-core       = { path = "arvik-core", version = "0.9.5" }
arvik-router     = { path = "arvik-router", version = "0.9.5" }
arvik-hyper      = { path = "arvik-hyper", version = "0.9.5" }
arvik-extract    = { path = "arvik-extract", version = "0.9.5" }
arvik-middleware = { path = "arvik-middleware", version = "0.9.5" }
arvik-ws         = { path = "arvik-ws", version = "0.9.5" }
arvik-sse        = { path = "arvik-sse", version = "0.9.5" }
arvik-static     = { path = "arvik-static", version = "0.9.5", default-features = false }
arvik-tls        = { path = "arvik-tls", version = "0.9.5" }
arvik-macros     = { path = "arvik-macros", version = "0.9.5" }
arvik-test       = { path = "arvik-test", version = "0.9.5" }
arvik-config     = { path = "arvik-config", version = "0.9.5" }
arvik-observe    = { path = "arvik-observe", version = "0.9.5", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
