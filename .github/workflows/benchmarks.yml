name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Use "smoke" for a quick 5s validation run or "manual" for artifact numbers.
        required: true
        default: manual
        type: choice
        options:
          - manual
          - smoke
      duration:
        description: Manual benchmark duration for wrk/hey/h2load.
        required: true
        default: 30s
        type: string
      h2load_requests:
        description: Fallback total h2load requests when no h2load duration is set.
        required: true
        default: "10000"
        type: string
      h2c_enabled:
        description: Run the dedicated h2c benchmark server and h2load.
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk golang-go nghttp2-client
          go install github.com/rakyll/hey@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Configure benchmark profile
        run: |
          if [ "${{ inputs.profile }}" = "smoke" ]; then
            duration="5s"
          else
            duration="${{ inputs.duration }}"
          fi

          echo "WRK_DURATION=$duration" >> "$GITHUB_ENV"
          echo "HEY_DURATION=$duration" >> "$GITHUB_ENV"
          echo "H2LOAD_DURATION=$duration" >> "$GITHUB_ENV"
          echo "H2LOAD_REQUESTS=${{ inputs.h2load_requests }}" >> "$GITHUB_ENV"

          if [ "${{ inputs.h2c_enabled }}" = "true" ]; then
            echo "BENCH_H2C=1" >> "$GITHUB_ENV"
          else
            echo "BENCH_H2C=0" >> "$GITHUB_ENV"
          fi

      - name: Run benchmark suite
        run: bash scripts/bench/run-all.sh

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvik-benchmark-results
          path: target/bench-results
