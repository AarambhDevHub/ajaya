[package]
name = "route-macro-demo"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "route macro example for Arvik"

[[bin]]
name = "route_macro"
path = "src/main.rs"

[dependencies]
arvik = { path = "../../arvik", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
