[package]
name = "websocket-chat"
version = "0.6.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Multi-room WebSocket chat server example for Arvik"

[[bin]]
name = "websocket_chat"
path = "src/main.rs"

[dependencies]
arvik        = { path = "../../arvik", features = ["ws"] }
tokio        = { version = "1", features = ["full"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json   = "1"
