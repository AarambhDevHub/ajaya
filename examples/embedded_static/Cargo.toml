[package]
name = "embedded-static-demo"
version = "0.6.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embedded static file serving example for Arvik"

[[bin]]
name = "embedded_static"
path = "src/main.rs"

[dependencies]
arvik = { path = "../../arvik", features = ["embedded-static"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
