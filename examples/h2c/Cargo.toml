[package]
name = "h2c-demo"
version = "0.6.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "HTTP/2 cleartext example for Arvik"

[[bin]]
name = "h2c"
path = "src/main.rs"

[dependencies]
arvik = { path = "../../arvik", features = ["http2"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
