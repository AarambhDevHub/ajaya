[package]
name = "rest-api"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Full REST API demo for Arvik — routing, middleware, cookies, streaming, CSRF"

[[bin]]
name = "rest_api"
path = "src/main.rs"

[dependencies]
arvik          = { path = "../../arvik" }
tokio          = { version = "1", features = ["full"] }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
bytes          = "1"
futures-util   = "0.3"
http           = "1"
cookie         = "0.18"
uuid           = { version = "1", features = ["v4"] }
