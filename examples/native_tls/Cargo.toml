[package]
name = "native-tls-demo"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "native-tls example for Arvik"

[[bin]]
name = "native_tls"
path = "src/main.rs"

[dependencies]
arvik = { path = "../../arvik", features = ["native-tls"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
