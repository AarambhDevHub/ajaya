[package]
name = "sse-demo"
version = "0.6.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SSE demo for Arvik — counter, JSON stream, broadcast notifications"

[[bin]]
name = "sse_demo"
path = "src/main.rs"

[dependencies]
arvik          = { path = "../../arvik", features = ["sse"] }
tokio          = { version = "1", features = ["full"] }
tokio-stream   = { version = "0.1", features = ["sync"] }
tracing-subscriber = "0.3"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
futures-util   = "0.3"
