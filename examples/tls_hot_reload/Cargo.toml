[package]
name = "tls-hot-reload"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rustls TLS hot reload example for Arvik"

[[bin]]
name = "tls_hot_reload"
path = "src/main.rs"

[dependencies]
arvik = { path = "../../arvik", features = ["tls-hot-reload"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
