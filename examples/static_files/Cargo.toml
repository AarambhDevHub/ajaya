[package]
name = "static-files-demo"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Static file serving example for Arvik"

[[bin]]
name = "static_files"
path = "src/main.rs"

[dependencies]
arvik = { path = "../../arvik", features = ["static-files"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
